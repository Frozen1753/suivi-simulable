<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/report/favicon.svg" />

    <!-- Fallback only: the real title comes from report/report.config.tsx -->
    <title>Report Maker</title>

    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("report-theme"); // = THEME_STORAGE_KEY in core/utils/theme/theme.ts
        } catch (e) {}
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
